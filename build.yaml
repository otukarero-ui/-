name: Build PSP EBOOT

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build EBOOT.PBP
        run: make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT
          path: EBOOT.PBP